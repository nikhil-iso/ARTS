[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	adafruit/Adafruit BMP280 Library@^3.0.0
	sparkfun/SparkFun TMP102 Breakout@^1.1.2
	sparkfun/SparkFun KX13X Arduino Library@^2.0.4
